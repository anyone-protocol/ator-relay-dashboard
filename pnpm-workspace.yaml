# pnpm refuses to run build scripts for git-hosted dependencies unless listed here.
# ao-client is our own package (pinned to a tag) and ships a committed dist/, but it declares a
# `prepare` script, which is enough to trip the check.
allowBuilds:
  # Our own package: git-hosted with a `prepare` script, so pnpm needs it listed.
  #
  # BOTH forms are required. pnpm >= ~11.2 refuses a git-hosted package listed by bare name and
  # demands the fully resolved tarball specifier; older pnpm matches the bare name and ignores the
  # long key. Listing only the bare name builds fine on a warm store (prepare never re-runs) and
  # then fails in a clean Docker build with ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED, which is exactly
  # how this reached CI unnoticed.
  #
  # ⚠️ The long key embeds the commit the `#v0.1.3` tag resolves to. Re-pin ao-client and this key
  # must be updated to match the new `pnpm-lock.yaml` resolution, or clean installs break again.
  '@anyone-protocol/ao-client': true
  '@anyone-protocol/ao-client@https://codeload.github.com/anyone-protocol/ao-client/tar.gz/3fc04052c7d76691d8345adcb24f6b5bf99d6988': true
  # Optional native builds. Left OFF — every install and test so far has run with these skipped
  # (they fall back to JS), and turning them on would change what has been verified.
  '@reown/appkit': false
  bufferutil: false
  esbuild: false
  keccak: false
  secp256k1: false
  utf-8-validate: false
  vue-demi: false

overrides:
  # BOUNDED on purpose: `>=8.21.0` alone would allow ws 9.x. Every override here must pin the
  # major, which is exactly what the inert package.json block failed to do.
  'ws@<8.21.0': '>=8.21.0 <9'
  # bn.js infinite loop (GHSA-378v-28hj-76wf). Both lines are present and both are on paths we
  # actually execute: 4.x via arweave > asn1.js and via elliptic (ANS-104 signing), 5.x via
  # @coinbase/wallet-sdk. Patch-level within each major, so bounded to the same major.
  'bn.js@<4.12.3': '>=4.12.3 <5'
  'bn.js@>=5.0.0 <5.2.3': '>=5.2.3 <6'

# NOTE: the rest of `overrides` deliberately NOT set here yet — see the audit findings. pnpm 10+ reads
# overrides from THIS file, so the 29 entries in package.json's `pnpm.overrides` are inert.
# Activating them as-written BREAKS the build (`h3@<=1.15.4: >=1.15.5` resolves to h3 2.x,
# which Nuxt 3.19 cannot load), so they need bounded ranges and a per-override build check.
