# pnpm refuses to run build scripts for git-hosted dependencies unless listed here.
# ao-client is our own package (pinned to a tag) and ships a committed dist/, but it declares a
# `prepare` script, which is enough to trip the check.
allowBuilds:
  # Our own package: git-hosted with a `prepare` script, so pnpm needs it listed.
  #
  # 🚨 KNOWN LANDMINE — THE TWO KEYS BELOW BREAK ANY DEPENDENCY CHANGE. 🚨
  #
  # Listing one package under two keys is read by pnpm as a versions union and rejected:
  #     ERR_PNPM_INVALID_VERSION_UNION ... Use exact versions only.
  #
  # It is latent because that check only runs when pnpm RE-RESOLVES. Installing from the existing
  # lockfile — `--frozen-lockfile`, the Docker build, CI — never trips it, so everything looks
  # green until someone adds, bumps, OR REMOVES a dependency. Removal is not a safe operation
  # here: it re-resolves like any other change.
  #
  # Both keys are present because the two pnpm versions in play want opposite things:
  #     pnpm 11.1.1  (local)     bare name REQUIRED, long form rejected outright
  #     pnpm 11.21.0 (container) bare name rejected with ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED,
  #                              long form required
  # No single key satisfies both, so this cannot be fixed by editing the keys alone.
  #
  # THE FIX, when someone next needs a dependency change:
  #   1. add `"packageManager": "pnpm@11.21.0"` to package.json and use that version locally
  #      (the Dockerfile already pins it)
  #   2. keep ONLY the long key below
  #   3. re-resolve, then DIFF THE LOCKFILE FOR DRIFT before committing
  # ⚠️ Step 3 is not optional. Doing this carelessly on 2026-08-15 silently moved
  # wagmi 2.15.3 -> 3.7.6, react 19 -> 18 and zod 4 -> 3, which broke the wagmi chain config
  # ("Chain not configured") at runtime. Pin anything that moves rather than accepting it.
  #
  # ⚠️ The long key embeds the commit the `#v0.1.3` tag resolves to. Re-pinning ao-client means
  # updating it to match the new `pnpm-lock.yaml` resolution.
  '@anyone-protocol/ao-client': true
  '@anyone-protocol/ao-client@https://codeload.github.com/anyone-protocol/ao-client/tar.gz/3fc04052c7d76691d8345adcb24f6b5bf99d6988': true
  # Optional native builds. Left OFF — every install and test so far has run with these skipped
  # (they fall back to JS), and turning them on would change what has been verified.
  '@reown/appkit': false
  bufferutil: false
  esbuild: false
  keccak: false
  secp256k1: false
  utf-8-validate: false
  vue-demi: false

overrides:
  # BOUNDED on purpose: `>=8.21.0` alone would allow ws 9.x. Every override here must pin the
  # major, which is exactly what the inert package.json block failed to do.
  'ws@<8.21.0': '>=8.21.0 <9'
  # bn.js infinite loop (GHSA-378v-28hj-76wf). Both lines are present and both are on paths we
  # actually execute: 4.x via arweave > asn1.js and via elliptic (ANS-104 signing), 5.x via
  # @coinbase/wallet-sdk. Patch-level within each major, so bounded to the same major.
  'bn.js@<4.12.3': '>=4.12.3 <5'
  'bn.js@>=5.0.0 <5.2.3': '>=5.2.3 <6'

# NOTE: the rest of `overrides` deliberately NOT set here yet — see the audit findings. pnpm 10+ reads
# overrides from THIS file, so the 29 entries in package.json's `pnpm.overrides` are inert.
# Activating them as-written BREAKS the build (`h3@<=1.15.4: >=1.15.5` resolves to h3 2.x,
# which Nuxt 3.19 cannot load), so they need bounded ranges and a per-override build check.
